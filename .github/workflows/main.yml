name: Build APK using p4a

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install cython setuptools

    - name: Install p4a (python-for-android)
      run: |
        git clone https://github.com/kivy/python-for-android.git
        cd python-for-android
        python setup.py install
        cd ..

    - name: Build APK using p4a
      run: |
        export PATH=$PATH:~/.local/bin
        p4a apk --private . \
                --package=org.moneytracker \
                --name "MoneyTracker" \
                --version 1.0 \
                --bootstrap=sdl2 \
                --requirements=python3,kivy==2.3.0,kivymd==2.0.0,matplotlib==3.8.0,Pillow==9.5.0 \
                --arch=arm64-v8a \
                --android-api=33 \
                --ndk-api=24 \
                --output-dir=./dist

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MoneyTracker-APK
        path: ./dist/*.apk
        if-no-files-found: error
